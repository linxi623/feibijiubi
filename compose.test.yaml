# Deliberately standalone: never combine with compose.yaml or reuse its volumes.
name: feibijiubi-test
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:13307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: isolated-test-only
      MYSQL_DATABASE: feibijiubi
    volumes:
      - test-mysql-data:/var/lib/mysql
      - ./database/feibijiubi.sql:/test-schema.sql:ro
      - ./src/test/docker/init-schema.sh:/docker-entrypoint-initdb.d/init-schema.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:16379:6379"
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "127.0.0.1:15673:5672"
      - "127.0.0.1:15674:15672"
    environment:
      RABBITMQ_DEFAULT_USER: isolated-test
      RABBITMQ_DEFAULT_PASS: isolated-test-only
    volumes:
      - test-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  test-mysql-data:
  test-rabbitmq-data:
